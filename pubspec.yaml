name: money_pet
description: 귀여운 친구와 함께, 매일 5분으로 금융 문맹 탈출
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리
  provider: ^6.1.2

  # 네비게이션
  go_router: ^13.2.0

  # Firebase - Upgraded to support GoogleUtilities 8.x
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.4
  firebase_analytics: ^11.3.3
  google_sign_in: ^6.2.1

  # 애니메이션
  rive: ^0.13.1

  # SNS 공유
  share_plus: ^7.2.2
  path_provider: ^2.1.2
  image: ^4.1.7

  # 차트
  fl_chart: ^0.66.2

  # 로컬 저장소
  shared_preferences: ^2.2.2

  # 유틸리티
  intl: ^0.19.0

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  # 에셋
  assets:
    # 캐릭터 애니메이션 설정 (JSON)
    - assets/animations/characters/hunter_cat/animation_config.json
    - assets/animations/characters/money_bear/animation_config.json
    - assets/animations/characters/save_sheep/animation_config.json
    - assets/animations/characters/chaser_fox/animation_config.json

    # 캐릭터 애니메이션 프레임 (프레임 파일 추가 시 자동 인식)
    # 헌터캣
    - assets/animations/characters/hunter_cat/idle/
    - assets/animations/characters/hunter_cat/selected/
    - assets/animations/characters/hunter_cat/happy/
    - assets/animations/characters/hunter_cat/thinking/
    - assets/animations/characters/hunter_cat/confused/

    # 머니베어
    - assets/animations/characters/money_bear/idle/
    - assets/animations/characters/money_bear/selected/
    - assets/animations/characters/money_bear/happy/
    - assets/animations/characters/money_bear/thinking/
    - assets/animations/characters/money_bear/confused/

    # 세이브쉽
    - assets/animations/characters/save_sheep/idle/
    - assets/animations/characters/save_sheep/selected/
    - assets/animations/characters/save_sheep/happy/
    - assets/animations/characters/save_sheep/thinking/
    - assets/animations/characters/save_sheep/confused/

    # 체이서폭스
    - assets/animations/characters/chaser_fox/idle/
    - assets/animations/characters/chaser_fox/selected/
    - assets/animations/characters/chaser_fox/happy/
    - assets/animations/characters/chaser_fox/thinking/
    - assets/animations/characters/chaser_fox/confused/

  # 폰트 (나중에 추가)
  # fonts:
  #   - family: Pretendard
  #     fonts:
  #       - asset: assets/fonts/Pretendard-Regular.ttf
  #       - asset: assets/fonts/Pretendard-Bold.ttf
  #         weight: 700
