name: money_pet
description: 귀여운 친구와 함께, 매일 5분으로 금융 문맹 탈출
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리
  provider: ^6.1.2

  # 네비게이션
  go_router: ^13.2.0

  # Firebase - Upgraded to support GoogleUtilities 8.x
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.4
  firebase_analytics: ^11.3.3
  google_sign_in: ^6.2.1

  # 애니메이션
  rive: ^0.13.1

  # SNS 공유
  share_plus: ^7.2.2
  path_provider: ^2.1.2
  image: ^4.1.7

  # 차트
  fl_chart: ^0.66.2

  # 로컬 저장소
  shared_preferences: ^2.2.2

  # 유틸리티
  intl: ^0.19.0

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  # 에셋
  assets:
    # 캐릭터 애니메이션 설정 (JSON)
    - assets/animations/characters/hunter_cat/animation_config.json
    - assets/animations/characters/money_bear/animation_config.json
    - assets/animations/characters/save_sheep/animation_config.json
    - assets/animations/characters/chaser_fox/animation_config.json

    # 캐릭터 애니메이션 프레임 (13-State System, 2025-12-24 업데이트)
    # 헌터캣 (13 states)
    - assets/animations/characters/hunter_cat/character_greeting_loop/
    - assets/animations/characters/hunter_cat/character_selected/
    - assets/animations/characters/hunter_cat/personality_idle/
    - assets/animations/characters/hunter_cat/personality_selected/
    - assets/animations/characters/hunter_cat/quiz_idle/
    - assets/animations/characters/hunter_cat/quiz_correct_flow/
    - assets/animations/characters/hunter_cat/quiz_wrong_flow/
    - assets/animations/characters/hunter_cat/result_celebration/
    - assets/animations/characters/hunter_cat/home_idle/
    - assets/animations/characters/hunter_cat/home_studying/
    - assets/animations/characters/hunter_cat/home_excited/
    - assets/animations/characters/hunter_cat/home_sleepy/
    - assets/animations/characters/hunter_cat/home_celebration/

    # 머니베어 (13 states)
    - assets/animations/characters/money_bear/character_greeting_loop/
    - assets/animations/characters/money_bear/character_selected/
    - assets/animations/characters/money_bear/personality_idle/
    - assets/animations/characters/money_bear/personality_selected/
    - assets/animations/characters/money_bear/quiz_idle/
    - assets/animations/characters/money_bear/quiz_correct_flow/
    - assets/animations/characters/money_bear/quiz_wrong_flow/
    - assets/animations/characters/money_bear/result_celebration/
    - assets/animations/characters/money_bear/home_idle/
    - assets/animations/characters/money_bear/home_studying/
    - assets/animations/characters/money_bear/home_excited/
    - assets/animations/characters/money_bear/home_sleepy/
    - assets/animations/characters/money_bear/home_celebration/

    # 세이브쉽 (13 states)
    - assets/animations/characters/save_sheep/character_greeting_loop/
    - assets/animations/characters/save_sheep/character_selected/
    - assets/animations/characters/save_sheep/personality_idle/
    - assets/animations/characters/save_sheep/personality_selected/
    - assets/animations/characters/save_sheep/quiz_idle/
    - assets/animations/characters/save_sheep/quiz_correct_flow/
    - assets/animations/characters/save_sheep/quiz_wrong_flow/
    - assets/animations/characters/save_sheep/result_celebration/
    - assets/animations/characters/save_sheep/home_idle/
    - assets/animations/characters/save_sheep/home_studying/
    - assets/animations/characters/save_sheep/home_excited/
    - assets/animations/characters/save_sheep/home_sleepy/
    - assets/animations/characters/save_sheep/home_celebration/

    # 체이서폭스 (13 states)
    - assets/animations/characters/chaser_fox/character_greeting_loop/
    - assets/animations/characters/chaser_fox/character_selected/
    - assets/animations/characters/chaser_fox/personality_idle/
    - assets/animations/characters/chaser_fox/personality_selected/
    - assets/animations/characters/chaser_fox/quiz_idle/
    - assets/animations/characters/chaser_fox/quiz_correct_flow/
    - assets/animations/characters/chaser_fox/quiz_wrong_flow/
    - assets/animations/characters/chaser_fox/result_celebration/
    - assets/animations/characters/chaser_fox/home_idle/
    - assets/animations/characters/chaser_fox/home_studying/
    - assets/animations/characters/chaser_fox/home_excited/
    - assets/animations/characters/chaser_fox/home_sleepy/
    - assets/animations/characters/chaser_fox/home_celebration/

